apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app: keycloak
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
      annotations:
        # Pod перезапускается при изменении настроек или app-realm.json
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/realm: {{ include (print $.Template.BasePath "/realm-configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Кластер PostgreSQL создаётся тем же чартом и поднимается около минуты.
        # Ждём, пока он начнёт принимать подключения, чтобы Keycloak не падал на старте.
        - name: wait-for-postgres
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - bash
            - -c
            - |
              until (exec 3<>/dev/tcp/{{ .Values.postgres.clusterName }}-rw/5432) 2>/dev/null; do
                echo "жду {{ .Values.postgres.clusterName }}-rw:5432"; sleep 3
              done
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: keycloak
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # --import-realm создаёт realm app из JSON при первом запуске, дальше пропускает
          args: ["start", "--import-realm"]
          envFrom:
            - configMapRef:
                name: keycloak-config
            # FEDOR_PASSWORD и BACKEND_CLIENT_SECRET для app-realm.json
            - secretRef:
                name: {{ .Values.secrets.realm }}
          env:
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.admin }}
                  key: KC_BOOTSTRAP_ADMIN_PASSWORD
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.db }}
                  key: username
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.db }}
                  key: password
          ports:
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8443
            - name: management
              containerPort: 9000
          # Порт 9000 работает по HTTPS, потому что Keycloak получил сертификат.
          # Kubelet не проверяет сертификат в пробах.
          startupProbe:
            httpGet:
              path: /health/started
              port: management
              scheme: HTTPS
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
              scheme: HTTPS
            periodSeconds: 15
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
              scheme: HTTPS
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            # Даём Ingress время убрать Pod из балансировки до остановки
            preStop:
              sleep:
                seconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
            - name: tls
              mountPath: /opt/keycloak/conf/tls
              readOnly: true
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
        - name: tls
          secret:
            secretName: {{ .Values.tls.secretName }}
