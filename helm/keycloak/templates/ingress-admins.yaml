# Ingress для администраторов: /admin (консоль и Admin REST API) только с разрешённых IP
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-for-admins
  namespace: {{ .Release.Namespace }}
  annotations:
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ .Values.ingress.adminWhitelist | quote }} # Здесь нужно указать IP VPN, доступный только администраторам Keycloak
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tlsEnabled }}
  tls:
    - hosts:
        - {{ .Values.hostname }}
      secretName: {{ .Values.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.hostname }}
      http:
        paths:
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
