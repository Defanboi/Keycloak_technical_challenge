apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-config
  labels:
    app: keycloak
data:
  KC_HOSTNAME: "https://{{ .Values.hostname }}"
  # <кластер>-rw всегда указывает на основной сервер PostgreSQL
  KC_DB_URL: "jdbc:postgresql://{{ .Values.postgres.clusterName }}-rw:5432/{{ .Values.postgres.database }}"
{{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
